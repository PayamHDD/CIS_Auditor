benchmark:
  name: CIS Oracle Linux 9
  version: "3.0.0"

controls:
  - id: "1.3.1.1"
    title: Ensure SELinux is installed
    level: 1
    type: automated

    audit:
      command: "rpm -q libselinux >/dev/null 2>&1 && echo PASS || echo FAIL"
      expected: "PASS"

    remediation:
      enabled: true
      commands:
        - "dnf install libselinux"
  - id: "1.3.1.2"
    title: Ensure SELinux is not disabled in bootloader configuration
    level: 1
    type: automated

    audit:
      command: "grubby --info=ALL | grep -Pq '(selinux|enforcing)=0\\b'; rc=$?; if [[ $rc -eq 1 ]]; then echo PASS; elif [[ $rc -eq 0 ]]; then echo FAIL; else echo ERROR; fi"
      expected: "PASS"

    remediation:
      enabled: true
      commands:
        - "grubby --update-kernel ALL --remove-args \"selinux=0 enforcing=0\""
  - id: "1.3.1.3"
    title: Ensure SELinux policy is configured
    level: 1
    type: automated

    audit:
      command: "grep -E '^[[:blank:]]*SELINUXTYPE[[:blank:]]*=[[:blank:]]*(targeted|mls)([[:blank:]]|$)' /etc/selinux/config >/dev/null 2>&1 && echo PASS || echo FAIL"
      expected: "PASS"

    remediation:
      enabled: false
      commands:
        - ""